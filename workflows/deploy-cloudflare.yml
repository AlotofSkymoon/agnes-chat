# =============================================================================
# ⚠️ 这个文件需要放在 .github/workflows/ 才会生效！
#
# 由于 GitHub 的安全限制，自动化推送无法直接写入 .github/workflows/ 目录，
# 所以本文件暂时放在仓库根目录的 workflows/ 下。启用自动部署只需做一次：
#
#   方法 A（网页端，推荐，30 秒）：
#     1. 打开仓库 → Add file → Create new file
#     2. 路径填：.github/workflows/deploy-cloudflare.yml
#     3. 把本文件内容粘贴进去 → Commit changes
#
#   方法 B（本地 git）：
#     mkdir -p .github/workflows
#     cp workflows/deploy-cloudflare.yml .github/workflows/
#     git add . && git commit -m "ci: enable cloudflare deploy" && git push
#
# 放好之后，每次推到 main 分支就会自动部署到 Cloudflare Workers。
# =============================================================================

name: 部署到 Cloudflare Workers

# 推荐部署方式：Workers + KV + D1 + R2，不需要 Redis
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖
        run: npm install

      # ---- 把 Secrets 里的 ID 填进 wrangler.jsonc 的占位符 ----
      - name: 填入 D1 / KV ID
        run: |
          test -n "${{ secrets.D1_DATABASE_ID }}" || (echo "::error::缺少 Secret D1_DATABASE_ID" && exit 1)
          test -n "${{ secrets.KV_NAMESPACE_ID }}" || (echo "::error::缺少 Secret KV_NAMESPACE_ID" && exit 1)
          sed -i "s|__D1_ID__|${{ secrets.D1_DATABASE_ID }}|g" wrangler.jsonc
          sed -i "s|__KV_ID__|${{ secrets.KV_NAMESPACE_ID }}|g" wrangler.jsonc
          echo "--- 已填入："
          grep -E "database_id|\"id\"" wrangler.jsonc

      - name: 建 D1 表（幂等，已存在不会重复建）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute agnes-chat-db --file=./schema.sql --remote --yes

      - name: 确保 R2 桶存在（已存在会跳过）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler r2 bucket create agnes-chat || true

      - name: 构建（OpenNext）
        run: npm run cf:build

      - name: 部署到 Workers
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # ---- 密钥：必须用 secret put，不能写进 wrangler.jsonc（会被提交到仓库）----
      - name: 写入站点密钥
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          put() {
            name="$1"; value="$2"
            if [ -z "$value" ]; then echo "跳过 $name（未设置）"; return; fi
            printf '%s' "$value" | npx wrangler secret put "$name" > /dev/null
            echo "已写入 $name"
          }
          put PRESET_AGNES_API_KEY "${{ secrets.PRESET_AGNES_API_KEY }}"
          put SESSION_SECRET      "${{ secrets.SESSION_SECRET }}"
          put R2_ACCOUNT_ID       "${{ secrets.R2_ACCOUNT_ID }}"
          put R2_ACCESS_KEY_ID    "${{ secrets.R2_ACCESS_KEY_ID }}"
          put R2_SECRET_ACCESS_KEY "${{ secrets.R2_SECRET_ACCESS_KEY }}"
          put R2_BUCKET           "${{ secrets.R2_BUCKET }}"
          put R2_PUBLIC_BASE_URL  "${{ secrets.R2_PUBLIC_BASE_URL }}"

      - name: 完成
        run: echo "部署完成，访问 Cloudflare Dashboard 查看 Workers 域名"
