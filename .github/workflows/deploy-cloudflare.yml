name: 部署到 Cloudflare Workers

# =============================================================================
# 唯一推荐的部署方式：**只填 GitHub Secrets，其余全自动**
#
# 要做的只有一件事 —— 去仓库 Settings → Secrets and variables → Actions 填值，
# 然后推送（或手动 Run workflow）。脚本会自动：
#   · 查找或创建 KV 命名空间 / D1 数据库 / R2 桶（不用手抄 32 位 ID）
#   · 把 ID 写回 wrangler.jsonc
#   · 把站点密钥注入运行时（解决「GitHub Secrets 线上读不到」的坑）
#   · 建 D1 表
#   · 构建并部署
#
# 不需要在 Cloudflare 后台做任何事，也不需要访问任何建表地址。
# =============================================================================

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      # 同时支持 Secrets 和 Variables（写法参考 cloud-mail）
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID || vars.KV_NAMESPACE_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID || vars.D1_DATABASE_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || vars.R2_BUCKET_NAME || 'agnes-chat' }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      PRESET_AGNES_API_KEY: ${{ secrets.PRESET_AGNES_API_KEY }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      STORAGE_BACKEND: ${{ vars.STORAGE_BACKEND || 'auto' }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      SITE_NAME: ${{ vars.SITE_NAME || 'Agnes AI' }}
      NEXT_PUBLIC_REQUIRE_LOGIN: ${{ vars.NEXT_PUBLIC_REQUIRE_LOGIN || 'false' }}
      NEXT_PUBLIC_ALLOW_WEB_SEARCH: ${{ vars.NEXT_PUBLIC_ALLOW_WEB_SEARCH || 'true' }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      # 邮箱验证（Resend）。不填则注册跳过验证，站点照常可用。
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: ${{ secrets.RESEND_FROM || vars.RESEND_FROM }}

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装依赖
        run: npm install

      # ------------------------------------------------------------------
      # 只校验真正必需的两项。KV / D1 / R2 的 ID 全部自动处理，
      # 不需要也不应该手填 —— 手填反而容易填错。
      # ------------------------------------------------------------------
      - name: 校验必需配置
        run: |
          set -e
          missing=0
          check() {
            if [ -z "$2" ]; then
              echo "::error::缺少 $1 —— 请在 Settings → Secrets and variables → Actions 里添加"
              missing=1
            fi
          }
          check CLOUDFLARE_API_TOKEN  "${CLOUDFLARE_API_TOKEN}"
          check CLOUDFLARE_ACCOUNT_ID "${CLOUDFLARE_ACCOUNT_ID}"
          check SESSION_SECRET        "${SESSION_SECRET}"
          check PRESET_AGNES_API_KEY  "${PRESET_AGNES_API_KEY}"
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "=============================================="
            echo "配置不全。上面列出的补齐后重新运行即可。"
            echo "其余（KV / D1 / R2）会自动创建，不用管。"
            echo "=============================================="
            exit 1
          fi
          echo "✅ 必需配置齐全"

      # ------------------------------------------------------------------
      # 核心一步：准备 KV / D1 / R2 并注入密钥
      #
      # 这是"只填 GitHub"能成立的关键 —— 密钥在这里被写进配置，
      # 所以部署后 Worker 运行时真的读得到。
      # 想改回自己在 Cloudflare 后台配，设变量 INJECT_SECRETS=false。
      # ------------------------------------------------------------------
      - name: 准备资源并注入配置
        env:
          INJECT_SECRETS: ${{ vars.INJECT_SECRETS || 'true' }}
        run: node scripts/prepare-deploy.mjs

      - name: 关闭 Wrangler 遥测
        run: npx wrangler telemetry disable || true

      # ------------------------------------------------------------------
      # 建表。幂等（全部 CREATE TABLE IF NOT EXISTS），重复执行无害。
      # 只有「Cloudflare 原生存储」模式才需要；统一用 Upstash 时会跳过。
      # ------------------------------------------------------------------
      - name: 建 D1 表
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${STORAGE_BACKEND}" = "upstash" ]; then
            echo "⏭ 统一 Upstash 模式，跳过 D1 建表"
            exit 0
          fi
          npx wrangler d1 execute agnes-chat-db --file=./schema.sql --remote --yes -c wrangler.action.jsonc \
            || echo "::warning::D1 建表失败（可能是统一 Upstash 模式，或数据库不存在）"

      - name: 构建（OpenNext）
        run: npm run cf:build

      - name: 报告构建产物体积
        run: |
          echo "=== .open-next 产物 ==="
          du -sh .open-next/ 2>/dev/null || true
          if [ -f .open-next/worker.js ]; then
            gz=$(gzip -c .open-next/worker.js | wc -c)
            echo "worker.js 压缩后: $((gz/1024)) KB  (免费版上限 1024 KB)"
            if [ "$gz" -gt 1048576 ]; then
              echo "::warning::超过 1 MiB，免费版会失败，需升级 Workers 付费版（上限 10 MiB）"
            fi
          fi

      - name: 部署到 Workers
        id: deploy
        run: |
          set -o pipefail
          if ! npx wrangler deploy -c wrangler.action.jsonc 2>&1 | tee deploy.log; then
            echo "::error::wrangler deploy 失败"
            echo ""
            echo "================ 常见原因 ================"
            echo "1) API 令牌权限不足（最常见，Authentication error 10000）："
            echo "   令牌需要这些权限 ——"
            echo "     账户 → Workers 脚本     → 编辑"
            echo "     账户 → Workers KV 存储  → 编辑"
            echo "     账户 → D1               → 编辑"
            echo "     账户 → Workers R2 存储  → 编辑"
            echo "     用户 → User Details     → 读取   ← 容易漏"
            echo "     用户 → Memberships      → 读取   ← 容易漏"
            echo "   最简单：用官方「编辑 Cloudflare Workers」模板，权限都已配好"
            echo "2) 脚本体积超标：看上一步的体积报告，免费版上限 1 MiB"
            echo "3) 未注册 workers.dev 子域名：Cloudflare 后台 → Workers 和 Pages → 设置子域名"
            echo "=========================================="
            exit 1
          fi
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)
          if [ -n "$URL" ]; then
            echo "::add-mask::$URL"
            echo "worker_url=$URL" >> $GITHUB_OUTPUT
          fi

      - name: 完成
        run: |
          echo "=============================================="
          echo "✅ 部署完成！"
          echo ""
          echo "站点地址：${{ steps.deploy.outputs.worker_url }}"
          echo ""
          echo "打开 /api/health 自检："
          echo "  ok: true        → 正常，注册第一个账号即成为管理员"
          echo "  problems 有内容 → 按提示修"
          echo ""
          echo "注意：本次没有让你手动访问任何建表地址 —— 表已经建好了。"
          echo "=============================================="

      - name: 删除旧运行记录
        uses: GitRML/delete-workflow-runs@main
        continue-on-error: true
        with:
          retain_days: '3'
          keep_minimum_runs: '2'
